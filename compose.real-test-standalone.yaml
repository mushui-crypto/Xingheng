services:
  web:
    labels:
      com.xingheng.real-test.topology: standalone
    command:
      - /bin/sh
      - -c
      - test -n "$$REAL_TEST_DOMAIN" || { echo "REAL_TEST_DOMAIN is required" >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile.real-test-standalone --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/verify-real-test-web-health
        - https
        - "${REAL_TEST_DOMAIN:?REAL_TEST_DOMAIN is required}"
        - "${XINGHENG_REVISION:?XINGHENG_REVISION must be a full Git commit}"
    networks:
      default:
      public_ingress: !reset null

networks:
  public_ingress: !reset null
