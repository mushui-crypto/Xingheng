services:
  api:
    build:
      context: .
      target: api
      args:
        GIT_COMMIT: "${GIT_COMMIT:-development}"

  web:
    build:
      context: .
      target: web
      args:
        GIT_COMMIT: "${GIT_COMMIT:-development}"

  strategy-history:
    build:
      context: .
      target: strategy-tools
      args:
        GIT_COMMIT: "${GIT_COMMIT:-development}"
