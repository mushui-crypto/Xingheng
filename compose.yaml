name: xingheng

services:
  api:
    build:
      context: .
      target: api
    user: "20001:20001"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      WEB_CONCURRENCY: "1"
      API_PORT: "8787"
      TRADING_DB_PATH: /app/data/trading.sqlite
      RWA_AUTOMATION_DATA_DIR: /app/rwa-automation-data
      RWA_AUTOMATION_EXECUTION_MODE: single-host
      RWA_AUTOMATION_INSTANCE_COUNT: "1"
      RWA_AUTOMATION_LOCK_DIR: /app/rwa-automation-lock
      RWA_AUTOMATION_LOCK_PATH: /app/rwa-automation-lock/operation.lock
      STRATEGY_FORWARD_REPORT_PATH: /app/strategy-data/route-b-forward.json
      STRATEGY_HISTORY_REPORT_PATH: /app/strategy-data/route-b-history.json
      STRATEGY_FORWARD_WORKER_POLL_MS: "300000"
      MARTINGALE_GRID_PAPER_REPORT_PATH: /app/strategy-data/martingale-grid-paper.json
      MARTINGALE_GRID_PAPER_WORKER_POLL_MS: "300000"
      FIXED_GRID_PAPER_REPORT_PATH: /app/strategy-data/fixed-grid-paper.json
      FIXED_GRID_ARCHIVE_CACHE_PATH: /app/strategy-data/fixed-grid-archive-cache
      FIXED_GRID_PAPER_WORKER_POLL_MS: "300000"
      TRUST_PROXY: "true"
      BSC_TESTNET_CHAIN_ID: "97"
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    volumes:
      - sqlite_data:/app/data
      - strategy_data:/app/strategy-data
      - sqlite_backups:/backups
      - rwa_automation_data:/app/rwa-automation-data
      - rwa_automation_lock:/app/rwa-automation-lock
      - type: bind
        source: /run/xingheng/gcp-wif
        target: /run/secrets/gcp-wif
        read_only: true
        bind:
          create_host_path: false
    command:
      - node
      - dist-server/index.js
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)throw Error(r.status)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  web:
    build:
      context: .
      target: web
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN is required; use --env-file .env.production}"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - test -n "$$DOMAIN" || { echo "DOMAIN is required" >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  strategy-history:
    profiles:
      - strategy-tools
    build:
      context: .
      target: strategy-tools
    environment:
      NODE_ENV: production
      STRATEGY_HISTORY_REPORT_PATH: /app/strategy-data/route-b-history.json
      STRATEGY_FORWARD_REPORT_PATH: /app/strategy-data/route-b-forward.json
      MARTINGALE_GRID_PAPER_REPORT_PATH: /app/strategy-data/martingale-grid-paper.json
      FIXED_GRID_PAPER_REPORT_PATH: /app/strategy-data/fixed-grid-paper.json
    volumes:
      - strategy_data:/app/strategy-data
    restart: "no"
    command:
      - npm
      - run
      - research:ict:history

  rwa-automation-backup:
    profiles:
      - rwa-automation-ops
    build:
      context: .
      target: api
    user: "20001:20001"
    environment:
      NODE_ENV: production
      RWA_AUTOMATION_DATA_DIR: /app/rwa-automation-data
      RWA_AUTOMATION_BACKUP_DIR: /app/rwa-automation-backups
      RWA_AUTOMATION_BACKUP_RETENTION_DAYS: "${RWA_AUTOMATION_BACKUP_RETENTION_DAYS:-30}"
      RWA_AUTOMATION_BACKUP_MAX_TOTAL_BYTES: "${RWA_AUTOMATION_BACKUP_MAX_TOTAL_BYTES:-1073741824}"
      RWA_AUTOMATION_BACKUP_MAX_SNAPSHOT_BYTES: "${RWA_AUTOMATION_BACKUP_MAX_SNAPSHOT_BYTES:-104857600}"
      RWA_CREDENTIAL_KEY_PROVIDER: gcp-kms
      RWA_GCP_KMS_KEY_NAME: projects/xingheng-production/locations/asia/keyRings/xingheng-rwa-prod-sg/cryptoKeys/exchange-credentials
      RWA_GCP_WIF_AUDIENCE: "${RWA_GCP_WIF_AUDIENCE:?RWA_GCP_WIF_AUDIENCE is required}"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-wif/adc.json
    volumes:
      - rwa_automation_data:/app/rwa-automation-data:ro
      - rwa_automation_backups:/app/rwa-automation-backups
      - rwa_automation_lock:/app/rwa-automation-lock
      - type: bind
        source: /run/xingheng/gcp-wif
        target: /run/secrets/gcp-wif
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
    command:
      - flock
      - -n
      - -x
      - /app/rwa-automation-lock/operation.lock
      - node
      - dist-server/operations/rwa-automation-backup.js
      - create

  rwa-automation-restore:
    profiles:
      - rwa-automation-ops
    build:
      context: .
      target: api
    user: "20001:20001"
    environment:
      NODE_ENV: production
      RWA_AUTOMATION_DATA_DIR: /app/rwa-automation-data
      RWA_AUTOMATION_BACKUP_DIR: /app/rwa-automation-backups
      RWA_AUTOMATION_BACKUP_RETENTION_DAYS: "${RWA_AUTOMATION_BACKUP_RETENTION_DAYS:-30}"
      RWA_AUTOMATION_BACKUP_MAX_TOTAL_BYTES: "${RWA_AUTOMATION_BACKUP_MAX_TOTAL_BYTES:-1073741824}"
      RWA_AUTOMATION_BACKUP_MAX_SNAPSHOT_BYTES: "${RWA_AUTOMATION_BACKUP_MAX_SNAPSHOT_BYTES:-104857600}"
      RWA_CREDENTIAL_KEY_PROVIDER: gcp-kms
      RWA_GCP_KMS_KEY_NAME: projects/xingheng-production/locations/asia/keyRings/xingheng-rwa-prod-sg/cryptoKeys/exchange-credentials
      RWA_GCP_WIF_AUDIENCE: "${RWA_GCP_WIF_AUDIENCE:?RWA_GCP_WIF_AUDIENCE is required}"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-wif/adc.json
    volumes:
      - rwa_automation_data:/app/rwa-automation-data
      - rwa_automation_backups:/app/rwa-automation-backups:ro
      - rwa_automation_lock:/app/rwa-automation-lock
      - type: bind
        source: /run/xingheng/gcp-wif
        target: /run/secrets/gcp-wif
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
    command:
      - flock
      - -n
      - -x
      - /app/rwa-automation-lock/operation.lock
      - node
      - dist-server/operations/rwa-automation-backup.js
      - restore

volumes:
  sqlite_data:
  strategy_data:
  sqlite_backups:
  rwa_automation_data:
  rwa_automation_backups:
  rwa_automation_lock:
  caddy_data:
  caddy_config:
