name: stellax-personal

services:
  api:
    image: "stellax-personal-api:${GIT_COMMIT:-latest}"
    env_file:
      - "${ENV_FILE:-.env.production}"
    environment:
      NODE_ENV: production
      API_PORT: "8787"
      GIT_COMMIT: "${GIT_COMMIT:-development}"
      LIVE_TRADING_ENABLED: "${LIVE_TRADING_ENABLED:-false}"
      BITGET_LIVE_TRADING_ENABLED: "${BITGET_LIVE_TRADING_ENABLED:-false}"
      BITGET_KILL_SWITCH: "${BITGET_KILL_SWITCH:-true}"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-wif/adc.json
      TRADING_DB_PATH: /app/data/trading.sqlite
      BINANCE_TRADING_DB_PATH: /app/data/binance-personal.sqlite
      BINANCE_USER_ORDER_DB_DIR: /app/data/binance-users
      STRATEGY_FORWARD_REPORT_PATH: /app/strategy-data/route-b-forward.json
      STRATEGY_HISTORY_REPORT_PATH: /app/strategy-data/route-b-history.json
      MARTINGALE_GRID_PAPER_REPORT_PATH: /app/strategy-data/martingale-grid-paper.json
      FIXED_GRID_PAPER_REPORT_PATH: /app/strategy-data/fixed-grid-paper.json
      FIXED_GRID_ARCHIVE_CACHE_PATH: /app/strategy-data/fixed-grid-archive-cache
      TRUST_PROXY: "true"
      BSC_TESTNET_CHAIN_ID: "97"
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    volumes:
      - sqlite_data:/app/data
      - strategy_data:/app/strategy-data
      - sqlite_backups:/backups
      - type: bind
        source: "${GOOGLE_ADC_DIR:?GOOGLE_ADC_DIR is required}"
        target: /run/secrets/gcp-wif
        read_only: true
        bind:
          create_host_path: false
    command: ["sh", "-c", "umask 077; exec node dist-server/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  web:
    image: "stellax-personal-web:${GIT_COMMIT:-latest}"
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN is required}"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  strategy-history:
    profiles: ["strategy-tools"]
    image: "stellax-personal-strategy-tools:${GIT_COMMIT:-latest}"
    environment:
      NODE_ENV: production
      STRATEGY_HISTORY_REPORT_PATH: /app/strategy-data/route-b-history.json
      STRATEGY_FORWARD_REPORT_PATH: /app/strategy-data/route-b-forward.json
    volumes:
      - strategy_data:/app/strategy-data
    restart: "no"
    command: ["npm", "run", "research:ict:history"]

  sqlite-backup:
    profiles: ["sqlite-ops"]
    image: "stellax-personal-api:${GIT_COMMIT:-latest}"
    environment:
      TRADING_DB_PATH: /app/data/trading.sqlite
      BINANCE_USER_ORDER_DB_DIR: /app/data/binance-users
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
    volumes:
      - sqlite_data:/app/data:ro
      - sqlite_backups:/backups
    network_mode: none
    restart: "no"
    entrypoint: ["/app/scripts/sqlite-backup.sh"]

  sqlite-restore:
    profiles: ["sqlite-ops"]
    image: "stellax-personal-api:${GIT_COMMIT:-latest}"
    environment:
      TRADING_DB_PATH: /app/data/trading.sqlite
      BINANCE_USER_ORDER_DB_DIR: /app/data/binance-users
    volumes:
      - sqlite_data:/app/data
      - sqlite_backups:/backups:ro
    network_mode: none
    restart: "no"
    entrypoint: ["/app/scripts/sqlite-restore-production.sh"]

volumes:
  sqlite_data:
  strategy_data:
  sqlite_backups:
  caddy_data:
  caddy_config:
